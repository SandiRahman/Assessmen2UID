<script src="script.js"></script>
<script>
const themes = {
  forest: "assets/forest.jpg",
  night: "assets/night.jpg",
  sunny: "assets/sunny.jpg",
  rain: "assets/rain.jpg"
};

const layer = document.getElementById("backgroundLayer");
const panel = document.getElementById("themePanel");

function setTheme(name) {
  if (!themes[name]) return;
  layer.style.backgroundImage = `linear-gradient(#0006,#0006),url("${themes[name]}")`;
  localStorage.setItem("fokusTheme", name);
}

document.getElementById("themeToggle").onclick = () => panel.classList.toggle("hidden");
document.getElementById("closeTheme").onclick = () => panel.classList.add("hidden");
document.querySelectorAll("[data-theme]").forEach(button => {
  button.onclick = () => setTheme(button.dataset.theme);
});

setTheme(localStorage.getItem("fokusTheme") || "forest");
lucide.createIcons();
</script>
