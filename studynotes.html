<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Notes - fokus.in</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-violet-950 text-white p-6">

    <div class="max-w-2xl mx-auto">

        <a href="Home.html" class="text-violet-400">
            ← Kembali ke Home
        </a>

        <h1 class="text-3xl font-bold mt-6">
            Study Notes
        </h1>

        <p class="text-white/50 mt-2">
            Simpan catatan materi belajarmu di sini.
        </p>

        <!-- FORM CATATAN -->
        <div class="bg-white/5 border border-white/10 rounded-2xl p-5 mt-6">

            <h2 class="text-xl font-bold mb-4">
                Tambah Catatan
            </h2>

            <input
                type="text"
                id="judul"
                placeholder="Judul catatan..."
                class="w-full p-3 rounded-xl bg-slate-800 mb-3"
            >

            <textarea
                id="isi"
                placeholder="Tulis catatanmu..."
                class="w-full p-3 rounded-xl bg-slate-800 h-32"
            ></textarea>

            <button
                onclick="tambahCatatan()"
                class="bg-violet-600 hover:bg-violet-700 px-5 py-3 rounded-xl mt-3 font-bold"
            >
                + Simpan Catatan
            </button>

        </div>

        <!-- DAFTAR CATATAN -->
        <div class="mt-8">

            <h2 class="text-xl font-bold mb-4">
                Catatan Saya
            </h2>

            <div id="daftarCatatan" class="space-y-3">
            </div>

        </div>

    </div>

    <script src="study-notes.js"></script>

</body>
</html>
