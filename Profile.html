<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fokus.in — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="profile" class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-violet-950 text-white">

  <!-- FLOATING SIDEBAR DESKTOP -->
  <aside class="hidden md:flex fixed left-6 top-1/2 -translate-y-1/2 z-50 h-[min(680px,85vh)] w-[82px] flex-col items-center rounded-full border border-white/10 bg-[#111014]/95 backdrop-blur-2xl shadow-2xl p-3">
    <a href="Home.html" class="mb-5 flex h-12 w-12 items-center justify-center rounded-full bg-violet-600 text-xl font-black shadow-lg shadow-violet-600/30">f.</a>
    <nav class="flex flex-col items-center gap-4 w-full">
      <a href="Home.html" title="Home" class="flex h-12 w-12 items-center justify-center rounded-2xl text-white/40 hover:bg-white/10 hover:text-white text-2xl">⌂</a>
      <a href="tasks.html" title="Tasks" class="flex h-12 w-12 items-center justify-center rounded-2xl text-white/40 hover:bg-white/10 hover:text-white text-2xl">☑</a>
      <a href="dashboard.html" title="Dashboard" class="flex h-12 w-12 items-center justify-center rounded-2xl text-white/40 hover:bg-white/10 hover:text-white text-2xl">▦</a>
      <a href="profile.html" title="Profile" class="flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-600 text-white shadow-lg shadow-violet-600/30 text-2xl">♙</a>
    </nav>
    <div class="my-6 h-px w-10 bg-white/10"></div>
    <div class="flex flex-col items-center gap-4">
      <button title="Pengaturan" class="flex h-12 w-12 items-center justify-center rounded-2xl text-white/40 hover:bg-white/10 hover:text-white text-xl">⚙</button>
      <button title="Tampilan" class="flex h-12 w-12 items-center justify-center rounded-2xl text-white/40 hover:bg-white/10 hover:text-white text-xl">◐</button>
    </div>
    <div class="mt-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-white/5 text-white/40 text-xl">◎</div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="w-full min-w-0 md:ml-28 p-5 md:p-8 pb-24 md:pb-8">
    <div class="max-w-4xl mx-auto space-y-6">

      <section>
        <p class="text-violet-400 text-sm font-bold">IDENTITAS & JEJAK BELAJAR</p>
        <h1 class="text-3xl font-black mt-1">Profil Kamu</h1>
      </section>

      <!-- PROFILE CARD -->
      <section class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 space-y-5">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=200&q=80" alt="suurr" class="h-20 w-20 rounded-full object-cover ring-2 ring-violet-500">
            <div>
              <h2 class="text-2xl font-black">suurr</h2>
              <p class="text-sm text-white/60 mt-1"><b class="text-white">1</b> Pengikut &nbsp;•&nbsp; <b class="text-white">1</b> Mengikuti</p>
            </div>
          </div>
          <button class="h-10 w-10 rounded-full text-white/50 hover:bg-white/10 hover:text-white text-xl">›</button>
        </div>

        <button class="w-full rounded-2xl border border-white/15 bg-white/5 hover:bg-white/10 py-3 font-semibold text-sm flex items-center justify-center gap-2">
          <span>👤+</span> Cari Teman Belajar
        </button>

        <div class="relative inline-block">
          <select class="appearance-none rounded-full border border-white/10 bg-black/40 px-4 py-2 pr-8 text-sm font-bold focus:outline-none">
            <option>🎓 saqib</option>
            <option>📚 vera</option>
            <option>⚡ saqib dan vera</option>
          </select>
          <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-white/50">▼</span>
        </div>
      </section>

      <!-- TABS & STATS -->
      <section class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl overflow-hidden">
        <div class="grid grid-cols-2 border-b border-white/10 text-sm font-bold">
          <button id="tabAktivitas" onclick="switchTab('aktivitas')" class="py-4 border-b-2 border-violet-500 text-white">Aktivitas</button>
          <button id="tabOpini" onclick="switchTab('opini')" class="py-4 border-b-2 border-transparent text-white/50 hover:text-white">Opini</button>
        </div>

        <div id="contentAktivitas" class="p-6 grid sm:grid-cols-2 gap-4">
          <div class="flex items-center gap-4 rounded-2xl border border-white/10 bg-black/25 p-5">
            <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-pink-500/15 text-pink-400 text-xl">☑</span>
            <div><p class="text-2xl font-black">1094</p><p class="text-sm text-white/50">Soal Dikerjakan</p></div>
          </div>
          <div class="flex items-center gap-4 rounded-2xl border border-white/10 bg-black/25 p-5">
            <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-500/15 text-indigo-400 text-xl">☰</span>
            <div><p class="text-2xl font-black">22</p><p class="text-sm text-white/50">Sesi Latsol</p></div>
          </div>
          <div class="flex items-center gap-4 rounded-2xl border border-white/10 bg-black/25 p-5">
            <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-500/15 text-emerald-400 text-xl">📄</span>
            <div><p class="text-2xl font-black">0</p><p class="text-sm text-white/50">Mini Tryout</p></div>
          </div>
          <div class="flex items-center gap-4 rounded-2xl border border-white/10 bg-black/25 p-5">
            <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-amber-500/15 text-amber-400 text-xl">📖</span>
            <div><p class="text-2xl font-black">6</p><p class="text-sm text-white/50">Tryout</p></div>
          </div>
        </div>

        <div id="contentOpini" class="hidden p-8 text-center text-white/50 text-sm">
          Belum ada opini yang dibagikan.
        </div>
      </section>

    </div>
  </main>

  <!-- MOBILE NAVIGATION -->
  <nav class="md:hidden fixed bottom-0 left-0 z-50 w-full border-t border-white/10 bg-slate-950/95 backdrop-blur-xl px-3 py-3 flex justify-around text-xs">
    <a href="index.html" class="flex flex-col items-center gap-1 text-white/50"><span class="text-xl">⌂</span>Home</a>
    <a href="tasks.html" class="flex flex-col items-center gap-1 text-white/50"><span class="text-xl">☑</span>Tasks</a>
    <a href="dashboard.html" class="flex flex-col items-center gap-1 text-white/50"><span class="text-xl">▦</span>Dashboard</a>
    <a href="profile.html" class="flex flex-col items-center gap-1 text-violet-400"><span class="text-xl">♙</span>Profile</a>
  </nav>

  <div id="toast" class="hidden fixed bottom-20 md:bottom-5 left-1/2 -translate-x-1/2 bg-violet-600 rounded-xl px-5 py-3"></div>

  <script>
    function switchTab(tab) {
      const isAktivitas = tab === 'aktivitas';
      document.getElementById('contentAktivitas').classList.toggle('hidden', !isAktivitas);
      document.getElementById('contentOpini').classList.toggle('hidden', isAktivitas);
      document.getElementById('tabAktivitas').className = `py-4 border-b-2 ${isAktivitas ? 'border-violet-500 text-white' : 'border-transparent text-white/50'}`;
      document.getElementById('tabOpini').className = `py-4 border-b-2 ${!isAktivitas ? 'border-violet-500 text-white' : 'border-transparent text-white/50'}`;
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
